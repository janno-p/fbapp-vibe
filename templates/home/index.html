{% extends "layout/base.html" %}

{% block title %}Kickoff — Sign in{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-6 relative overflow-hidden">
  {# Background pitch lines decoration #}
  <div class="absolute inset-0 pointer-events-none select-none" aria-hidden="true">
    <div class="absolute left-1/2 top-0 -translate-x-1/2 w-px h-full bg-pitch-700 opacity-40"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full border border-pitch-700 opacity-30"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 rounded-full border border-pitch-700 opacity-20"></div>
  </div>

  <div class="relative z-10 text-center max-w-sm w-full">
    {# Badge #}
    <div class="inline-flex items-center gap-2 bg-pitch-800 border border-pitch-700 rounded-full px-4 py-1.5 mb-8">
      <span class="w-2 h-2 rounded-full bg-goal-500 animate-pulse"></span>
      <span class="text-xs font-display font-medium tracking-widest uppercase text-goal-400">Tournament Predictor</span>
    </div>

    <h1 class="font-display font-bold text-5xl tracking-tight text-ink-50 mb-3 leading-none">
      Kickoff
    </h1>
    <p class="text-ink-300 text-sm mb-10 leading-relaxed">
      Compete with your friends. Predict every match.<br>Climb the table.
    </p>

    <a href="/auth/login"
       class="inline-flex items-center justify-center gap-3 w-full bg-pitch-800 border border-pitch-600 hover:border-goal-500 rounded-xl px-6 py-3.5 text-ink-100 font-medium text-sm transition-all duration-200 hover:bg-pitch-700 group">
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
      <span class="ml-auto text-ink-500 group-hover:text-goal-400 transition-colors">→</span>
    </a>
  </div>
</div>
{% endblock %}
