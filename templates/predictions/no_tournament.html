{% extends "layout/base.html" %}

{% block title %}Predictions{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50">
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold text-gray-900">Predictions</h1>
    <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">← Dashboard</a>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-16 text-center">
    <div class="text-gray-400 text-5xl mb-6">⏳</div>
    <h2 class="text-xl font-semibold text-gray-900 mb-2">Predictions aren't open yet</h2>
    <p class="text-gray-500 mb-8">No tournament is currently active. Check back once an admin has activated a tournament.</p>
    <a href="/dashboard"
       class="inline-block bg-indigo-600 text-white text-sm font-medium px-5 py-2 rounded-md hover:bg-indigo-700 transition-colors">
      Back to dashboard
    </a>
  </main>
</div>
{% endblock %}
