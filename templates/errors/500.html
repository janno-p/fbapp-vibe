{% extends "layout/base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6">
  <div class="text-center max-w-sm">
    <p class="font-display font-bold text-8xl text-pitch-700 mb-4 tracking-tight">500</p>
    <h1 class="font-display font-bold text-2xl tracking-tight text-ink-50 mb-2">Something went wrong</h1>
    <p class="text-sm text-ink-500 mb-8 leading-relaxed">An unexpected error occurred. Please try again or go back to the dashboard.</p>
    <a href="/dashboard"
       class="inline-block bg-goal-600 hover:bg-goal-500 text-ink-50 text-sm font-medium px-5 py-2.5 rounded-lg transition-colors">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
