{% extends "layout/base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-6">
  <div class="text-center max-w-sm">
    <p class="text-6xl font-bold text-gray-200 mb-4">500</p>
    <h1 class="text-xl font-semibold text-gray-900 mb-2">Something went wrong</h1>
    <p class="text-sm text-gray-500 mb-6">An unexpected error occurred. Please try again or go back to the dashboard.</p>
    <a href="/dashboard" class="inline-block bg-indigo-600 text-white text-sm font-medium px-5 py-2 rounded-md hover:bg-indigo-700 transition-colors">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
