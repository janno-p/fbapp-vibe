services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://fbapp:fbapp@db:5432/fbapp
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fbapp
      POSTGRES_PASSWORD: fbapp
      POSTGRES_DB: fbapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: local Jaeger instance for distributed tracing.
  # Start with: docker compose up jaeger
  # View traces at: http://localhost:16686
  # Enable export by setting OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC collector
      - "16686:16686" # Jaeger web UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres_data:
